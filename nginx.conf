server {
listen 80;
server_name _;

root /usr/share/nginx/html;
index index.html;

location / {
    # Esta é a ÚNICA regra necessária para SPAs
    try_files $uri $uri/ /index.html;
}

# Desabilitar logs de acesso para arquivos estáticos comuns (opcional, mas bom)
location ~* \.(css|js|gif|jpe?g|png)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
}


}